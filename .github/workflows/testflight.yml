name: TestFlight

# Started by hand from the Actions tab ("Run workflow"). Signs the app with Apple's cloud-managed certificates through an
# App Store Connect API key and uploads the build, which then shows up in TestFlight after Apple's processing.
# Needs these repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the whole .p8 file) and APPLE_TEAM_ID.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      # Archived unsigned: the development profile needs a registered test device. The export step signs for distribution.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive -project KaloCalc.xcodeproj -scheme KaloCalc -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/KaloCalc.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -n 40
      - name: Export and upload
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/KaloCalc.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -n 40
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
