name: App Store metadata

# Started by hand. "inspect" only reads App Store Connect; "apply" fills in texts, screenshots, review information and the build
# from store/. It never submits the version for review. The review contact phone comes from the REVIEW_PHONE secret
# (workflow inputs of a public repo are visible to everyone), written like +359 88 123 4567.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect, check or builds (read only) or apply (write)
        type: choice
        options: [inspect, check, apply, builds]
        default: inspect

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography
      - name: Run
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GEMINI_REVIEW_KEY: ${{ secrets.GEMINI_REVIEW_KEY }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
        run: python3 tools/asc_metadata.py "${{ inputs.mode }}"
