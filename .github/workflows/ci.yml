name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: KaloCalcCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: KaloCalcCore

  app-ios:
    name: App (iOS simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Pick a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          # A Pro Max has the 6.9-inch screen (1320x2868) that App Store screenshots are taken on.
          found = [(d['name'], d['udid']) for runtime, devs in json.load(sys.stdin)['devices'].items()
                   if 'iOS' in runtime for d in devs if d['name'].startswith('iPhone')]
          found.sort(key=lambda f: ('Pro Max' not in f[0], f[0]))
          print(found[0][1])
          ")
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -project KaloCalc.xcodeproj -scheme KaloCalc -derivedDataPath build \
            -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO | tail -n 80
      - name: Screenshots
        run: tools/screenshots.sh "$DEVICE" build/Build/Products/Debug-iphonesimulator/KaloCalc.app screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png

  ipa:
    name: Unsigned .ipa (device)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      # Built for real devices but not signed: BrowserStack, AltStore and Sideloadly sign it again with their own certificate.
      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild build -project KaloCalc.xcodeproj -scheme KaloCalc -configuration Release -derivedDataPath build-device \
            -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 30
      - name: Package KaloCalc.ipa
        run: |
          mkdir -p ipa/Payload
          cp -R build-device/Build/Products/Release-iphoneos/KaloCalc.app ipa/Payload/
          (cd ipa && zip -qry KaloCalc.ipa Payload)
          unzip -l ipa/KaloCalc.ipa | tail -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: KaloCalc-ipa
          path: ipa/KaloCalc.ipa
