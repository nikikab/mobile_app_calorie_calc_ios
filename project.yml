# Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# On a Mac: `brew install xcodegen && xcodegen generate` creates KaloCalc.xcodeproj.
name: KaloCalc
options:
  bundleIdPrefix: com.nikikabadzhov
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  KaloCalcCore:
    path: KaloCalcCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KaloCalc:
    type: application
    platform: iOS
    sources:
      - path: KaloCalc
    dependencies:
      - package: KaloCalcCore
    info:
      path: KaloCalc/Info.plist
      properties:
        CFBundleDisplayName: KaloCalc
        CFBundleLocalizations: [en, bg, de, es, fr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikikabadzhov.kalocalc
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: [KaloCalcTests]
  KaloCalcTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KaloCalcTests
    dependencies:
      - target: KaloCalc
